openapi: 3.0.3
info:
  title: Online Examination Platform
  version: 1.1.0
  description: >-
    Pre-release public contract amended by ADR-005 for verified email and asymmetric session JWTs.
    No runtime deployment. Product/security/SLO requirements in docs; all
    response examples are fixtures.
x-session-token-contract:
  format: JWT
  algorithm: ES256
  curve: P-256
  keySource: trusted-keyring
  authority: PostgreSQL
  issuer: environment-specific typed configuration
  requiredClaims: [iss, aud, sub, jti, sid, fid, iat, nbf, exp, token_use]
  access:
    typ: exam-access+jwt
    audience: urn:online-exam:api:v1
    tokenUse: access
    ttlSeconds: 300
  refresh:
    typ: exam-refresh+jwt
    audience: urn:online-exam:refresh:v1
    tokenUse: refresh
    idleTtlSeconds: 604800
    familyAbsoluteTtlSeconds: 2592000
servers:
  - url: /
    description: Same HTTPS viewer origin; account/region/domain/TLS deployment pending
tags:
  - name: Identity
  - name: Catalog
  - name: Assessment
  - name: Reporting
  - name: Platform
paths:
  /v1/auth/csrf:
    get:
      operationId: getCsrf
      summary: getCsrf
      tags:
        - Identity
      security: []
      parameters: []
      responses:
        "200":
          description: Authorized projection
          headers:
            X-Correlation-Id:
              description: Server-generated/validated UUID correlation ID.
              schema:
                type: string
                format: uuid
            Cache-Control:
              description: no-store for authenticated/sensitive payloads.
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfEnvelope"
        "400":
          $ref: "#/components/responses/Http400"
        "401":
          $ref: "#/components/responses/Http401"
        "403":
          $ref: "#/components/responses/Http403"
        "404":
          $ref: "#/components/responses/Http404"
        "409":
          $ref: "#/components/responses/Http409"
        "422":
          $ref: "#/components/responses/Http422"
        "429":
          $ref: "#/components/responses/Http429"
        "500":
          $ref: "#/components/responses/Http500"
        "503":
          $ref: "#/components/responses/Http503"
      x-owner: Identity
      x-flow: read
      x-permissions: []
      x-transaction: none
      x-idempotency: false
      x-cases:
        - AC-21
  /v1/auth/register:
    post:
      operationId: register
      summary: Register a pending email/password account; always generic acknowledgement
      description: >-
        No session is issued. A new pending user, challenge and encrypted email intent commit atomically.
        Existing credentials are never overwritten. Email confirmation chooses the final password.
      tags:
        - Identity
      security:
        - CsrfHeader: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "202":
          description: Durable accepted outcome
          headers:
            X-Correlation-Id:
              description: Server-generated/validated UUID correlation ID.
              schema:
                type: string
                format: uuid
            Cache-Control:
              description: no-store for authenticated/sensitive payloads.
              schema:
                type: string
                enum:
                  - no-store
            Retry-After:
              description: Seconds before retry/poll.
              schema:
                type: integer
                minimum: 1
                maximum: 60
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedEnvelope"
        "400":
          $ref: "#/components/responses/Http400"
        "401":
          $ref: "#/components/responses/Http401"
        "403":
          $ref: "#/components/responses/Http403"
        "404":
          $ref: "#/components/responses/Http404"
        "409":
          $ref: "#/components/responses/Http409"
        "422":
          $ref: "#/components/responses/Http422"
        "429":
          $ref: "#/components/responses/Http429"
        "500":
          $ref: "#/components/responses/Http500"
        "503":
          $ref: "#/components/responses/Http503"
      x-owner: Identity
      x-flow: write
      x-permissions: []
      x-transaction: identity + verification challenge + encrypted email intent
      x-idempotency: false
      x-cases:
        - AC-20
        - AC-33
        - AC-35
        - AC-31
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
  /v1/auth/email-verification/request:
    post:
      operationId: requestEmailVerification
      summary: Request or resend a verification link with a generic acknowledgement
      description: >-
        Always 202 for eligible, absent, disabled or already verified accounts. Eligible pending
        accounts use a 60s cooldown and bounded mail requests. Reuse the live challenge/link;
        do not invalidate a valid link on an unauthenticated resend. No session or token in JSON.
      tags: [Identity]
      security:
        - CsrfHeader: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestEmailVerificationRequest"
      responses:
        "202":
          description: Generic acknowledgement; eligible email intent durably accepted, inbox delivery not guaranteed
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            X-Correlation-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedEnvelope"
              example: { data: { accepted: true }, errorCode: null, message: null, status: true }
        "400":
          $ref: "#/components/responses/Http400"
        "403":
          $ref: "#/components/responses/Http403"
        "429":
          $ref: "#/components/responses/Http429"
        "500":
          $ref: "#/components/responses/Http500"
        "503":
          $ref: "#/components/responses/Http503"
      x-owner: Identity
      x-flow: write
      x-permissions: []
      x-transaction: identity + verification challenge + encrypted email intent
      x-idempotency: false
      x-cases: [AC-20, AC-33, AC-35, AC-31]
  /v1/auth/email-verification/confirm:
    post:
      operationId: confirmEmailVerification
      summary: Consume the one-use link and activate the account with the email owner's final password
      description: >-
        An explicit user POST with anonymous CSRF is required. No GET activation or automatic login.
        Invalid/expired/cancelled tokens return generic Invalid request. A retry of the same consumed
        challenge before expiry returns verified=true without changing credentials again.
      tags: [Identity]
      security:
        - CsrfHeader: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmEmailVerificationRequest"
      responses:
        "200":
          description: Account activated or original consumed-challenge outcome confirmed; no auth cookies issued
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            X-Correlation-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifiedEnvelope"
              example: { data: { verified: true }, errorCode: null, message: null, status: true }
        "400":
          $ref: "#/components/responses/Http400"
        "403":
          $ref: "#/components/responses/Http403"
        "429":
          $ref: "#/components/responses/Http429"
        "500":
          $ref: "#/components/responses/Http500"
        "503":
          $ref: "#/components/responses/Http503"
      x-owner: Identity
      x-flow: write
      x-permissions: []
      x-transaction: identity activation + challenge consumption + cancel other email intents
      x-idempotency: false
      x-cases: [AC-33, AC-31]
  /v1/auth/login:
    post:
      operationId: login
      summary: Email/password login for enabled accounts with verified email
