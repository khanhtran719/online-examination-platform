      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      example:
        email: candidate@example.com
    ConfirmEmailVerificationRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          description: Separate 256-bit opaque verification capability, base64url without padding; not an access/refresh JWT.
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          writeOnly: true
        password:
          type: string
          description: Final password chosen by the email owner during pending activation; never changes an already activated credential.
          minLength: 15
          maxLength: 128
          writeOnly: true
      example:
