components:
  securitySchemes:
    AccessCookie:
      type: apiKey
      in: cookie
      name: __Host-access
      description: Asymmetric signed access JWT; strict purpose validation plus authoritative DB session/permissions check.
    RefreshCookie:
      type: apiKey
      in: cookie
      name: __Host-refresh
      description: Asymmetric signed refresh JWT; single-use rotation and durable family revocation in PostgreSQL.
    CsrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Signed cookie echo plus exact Origin validation; not authentication.
  responses:
    Http400:
      description: Invalid request
      headers:
        X-Correlation-Id:
          description: Server-generated/validated UUID correlation ID.
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            errorCode: Invalid request
            message: Invalid request
            status: false
    Http401:
      description: Unauthenticated
      headers:
        X-Correlation-Id:
          description: Server-generated/validated UUID correlation ID.
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            errorCode: Unauthenticated
            message: Unauthenticated
            status: false
    Http403:
      description: Permission denied
      headers:
        X-Correlation-Id:
          description: Server-generated/validated UUID correlation ID.
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            errorCode: Permission denied
            message: Permission denied
            status: false
    Http404:
      description: Not found
      headers:
        X-Correlation-Id:
          description: Server-generated/validated UUID correlation ID.
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            errorCode: Not found
            message: Not found
            status: false
    Http409:
      description: Version conflict
      headers:
        X-Correlation-Id:
          description: Server-generated/validated UUID correlation ID.
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            errorCode: Version conflict
            message: Version conflict
            status: false
    Http422:
      description: Attempt is closed
      headers:
        X-Correlation-Id:
          description: Server-generated/validated UUID correlation ID.
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            errorCode: Attempt is closed
            message: Attempt is closed
            status: false
    Http429:
      description: Rate limit exceeded
      headers:
        X-Correlation-Id:
          description: Server-generated/validated UUID correlation ID.
          schema:
            type: string
            format: uuid
        Retry-After:
          description: Seconds before retry/poll.
          schema:
            type: integer
            minimum: 1
            maximum: 60
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            errorCode: Rate limit exceeded
            message: Rate limit exceeded
            status: false
    Http500:
      description: Internal error
      headers:
        X-Correlation-Id:
          description: Server-generated/validated UUID correlation ID.
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            errorCode: Internal error
            message: Internal error
            status: false
    Http503:
      description: Service unavailable
      headers:
        X-Correlation-Id:
          description: Server-generated/validated UUID correlation ID.
          schema:
            type: string
            format: uuid
        Retry-After:
          description: Seconds before retry/poll.
          schema:
            type: integer
            minimum: 1
            maximum: 60
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            errorCode: Service unavailable
            message: Service unavailable
            status: false
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      description: >-
        Exact allowlisted HTTPS viewer origin; browser supplies it. Local development uses explicitly
        configured localhost origin.
      schema:
        type: string
        format: uri
        maxLength: 512
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Canonical UUIDv7, first use within 24h and <=5min future skew; compact receipt retained >=7days.
        ADR-003.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 2048
      description: Signed keyset cursor bound to filter/version/order/actor/page size; expires 15min.
    Category:
      name: category
      in: query
      schema:
        type: string
        enum:
          - TOEIC
          - IELTS
          - IT_CERTIFICATION
          - UNIVERSITY
          - RECRUITMENT
          - CORPORATE
    PublishedVersionFilter:
      name: publishedVersionId
      in: query
      schema:
        type: string
        format: uuid
