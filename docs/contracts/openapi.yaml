  /v1/admin/exams/{examId}/active-candidates:
    get:
      operationId: listActiveCandidates
      summary: Monitor current in-progress attempts for an exam
      description: |
        Requires current reporting.read permission; v1 Admin scope covers all
        frozen versions of the requested exam, including unpublished/archived
        exams. Returns only retained IN_PROGRESS attempts whose startedAt <=
        metadata.asOf and deadline > metadata.asOf. This is attempt lifecycle
        monitoring, not browser presence; disabled candidates remain visible.
        Primary PostgreSQL statement snapshot, fresh on every page. Submitted or
        expired attempts disappear on subsequent reads. Mandatory access audit
        commits before response; audit failure returns no report.
        Order is startedAt DESC, attemptId DESC. The opaque cursor binds actor,
        exam and page size, excludes later starts using the initial watermark and
        expires 60 seconds after the first page. Pagination is a live bounded view,
        not a frozen snapshot or write/authorization authority. No total count.
      tags:
        - Reporting
      security:
        - AccessCookie: []
      parameters:
        - name: examId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PageSize"
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 2048
          description: Opaque authenticated keyset cursor bound to actor/exam/page size; expires 60s from first page.
      responses:
        "200":
          description: Authorized projection
          headers:
            X-Correlation-Id:
              description: Server-generated/validated UUID correlation ID.
              schema:
                type: string
                format: uuid
            Cache-Control:
              description: no-store for authenticated/sensitive payloads.
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveCandidateListEnvelope"
        "400":
          $ref: "#/components/responses/Http400"
        "401":
          $ref: "#/components/responses/Http401"
        "403":
          $ref: "#/components/responses/Http403"
        "404":
          $ref: "#/components/responses/Http404"
        "409":
          $ref: "#/components/responses/Http409"
        "422":
          $ref: "#/components/responses/Http422"
        "429":
          $ref: "#/components/responses/Http429"
        "500":
          $ref: "#/components/responses/Http500"
        "503":
          $ref: "#/components/responses/Http503"
      x-owner: Reporting
      x-flow: read
      x-permissions:
        - reporting.read
      x-transaction: audit-read
      x-idempotency: false
      x-cases:
        - AC-18
        - AC-22
        - AC-24
        - AC-27
        - AC-31
      x-paginated: true
  /v1/admin/exams/{examId}/submissions:
    get:
      operationId: listSubmissions
      summary: Browse exam attempts and submitted scores
      description: >-
        Primary attempt ledger includes unsubmitted attempts with null submittedAt/scores.
        Optional publishedVersionId must belong to this exam or404. Includes frozen
        archived/unpublished versions and ranking opt-out candidates; excludes purged
        payloads. Only durable COMPLETED attempts have scores. No PII, answers or keys.
        Ordering is immutable startedAt DESC/attemptId DESC. Opaque15min cursor binds
        current actor/exam/version/pageSize/order and initial DB watermark/expiry.
        State/scores are fresh per page, not a multi-page snapshot. Later starts are
        excluded; purge may remove rows. Current reporting.read and mandatory access
        audit share one transaction; audit failure returns no data.
      tags:
        - Reporting
      security:
        - AccessCookie: []
      parameters:
        - name: examId
          in: path
          required: true
          schema:
            type: string
