        empty selections are unanswered. Option selectedCount can sum above answered
        for multiple choice. Duplicate/replay adds no second contribution; purge
        subtracts atomically. No PII, prompts, answers, keys or explanations.
        Frozen section position/question position/question UUID ascending order.
